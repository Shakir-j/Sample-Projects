<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>F1 -The official Home of Formula 1 Racing</title>
  <link rel="icon" href="images/F1_Logo.avif" type="image/avif">
 
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="nav-left">
      <a href="https://www.formula1.com/en/racing/2025" target="_blank">
        <div class="logo">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg" alt="F1 Logo" />
        </a>
        </div>
        <nav class="menu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="races.html">Races</a></li>
            <li>Drivers</li>
            <li>Teams</li>
            <li>Drivers Standings</li>
          </ul>
        </nav>
      </div>

    
    <div class="nav-right">
      <i class="ri-search-line"></i>
      <i class="ri-flag-line"></i>
      <i class="ri-menu-line"></i>
      <i class="ri-sun-line" id="theme" title="Toggle Light/Dark Mode"></i>


    </div>
  </header>

  <section class="Welcome">
    <h2>Welcome To The 2025 Season</h2>
    <h1>F1 GRAND PRIX</h1>

  <script src="theme.js"></script>
